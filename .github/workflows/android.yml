name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build with Gradle
      run: ./gradlew assembleDebug lintDebug
    - name: Run unit tests
      run: ./gradlew testDebugUnitTest

  instrumented:

    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # The emulator needs hardware acceleration on the runner; without this udev
    # rule /dev/kvm is not usable and the AVD never finishes booting.
    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
          | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    # Runs every connected screen suite (app + developtools) on one AVD.
    # Both tasks are passed to a single Gradle invocation so a failure in either
    # module fails the build; a separate shell line could mask the first result.
    # Note: the app fetches app-update.json at startup, so minimum_version on
    # main must stay at or below versionName or every activity redirects to
    # MandatoryUpdateActivity and these tests fail.
    - name: Run instrumented tests
      uses: ReactiveCircus/android-emulator-runner@v2
      with:
        api-level: 35
        target: google_apis
        arch: x86_64
        profile: pixel_6
        disable-animations: true
        emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
        script: ./gradlew :app:connectedDebugAndroidTest :developtools:connectedDebugAndroidTest

    - name: Upload instrumented test reports
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: instrumented-test-reports
        path: |
          app/build/reports/androidTests/
          developtools/build/reports/androidTests/
          app/build/outputs/androidTest-results/
          developtools/build/outputs/androidTest-results/
        if-no-files-found: ignore
